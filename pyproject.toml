[project]
name = "omap-router"
version = "0.1.0"
description = "Sprint orienteering map analysis and least-cost route finder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "shapely>=2.0",
    "pytesseract>=0.3.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=10.2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omap_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
